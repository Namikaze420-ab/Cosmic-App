<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111318" />
  <meta name="description" content="Cosmic Planner Alpha 3.0 staging release-hardening experience" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Cosmic Planner" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.json?v=alpha3-0" />
  <link rel="stylesheet" href="styles.css?v=alpha3-0" />
  <link rel="stylesheet" href="alpha-fix.css?v=alpha3-0" />
  <link rel="stylesheet" href="alpha27-quality.css?v=alpha3-0" />
  <link rel="stylesheet" href="insights-alpha30.css?v=alpha3-0" />
  <link rel="stylesheet" href="planner-alpha28.css?v=alpha3-0" />
  <link rel="stylesheet" href="planner-alpha29.css?v=alpha3-0" />
  <link rel="stylesheet" href="planner-alpha29-fix.css?v=alpha3-0" />
  <title>Cosmic Planner — Alpha 3.0 Preview</title>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Primary navigation">
      <div class="brand"><span class="brand-mark">✦</span><div><strong>Cosmic</strong><span>Planner</span></div></div>
      <nav id="desktopNav" class="nav-stack"></nav>
      <div class="sidebar-card">
        <span class="eyebrow">Today’s alignment</span>
        <div class="mini-score"><strong>--</strong><span>/100</span></div>
        <p>Complete your birth profile to activate scoring.</p>
      </div>
      <button class="profile-chip" data-page="profile"><span class="avatar">CP</span><span><strong>Cosmic User</strong><small>Alpha 3.0 staging</small></span><span>›</span></button>
    </aside>

    <main class="main" id="mainContent" tabindex="-1">
      <header class="topbar">
        <div><span class="eyebrow" id="pageEyebrow">ALPHA 3.0</span><h1 id="pageTitle">Today</h1></div>
        <div class="top-actions"><button class="icon-btn" id="searchBtn" aria-label="Search">⌕</button><button class="primary-btn" id="quickAdd">＋ Add plan</button></div>
      </header>

      <section id="page-home" class="page active"></section>
      <section id="page-calendar" class="page"></section>
      <section id="page-diary" class="page"></section>
      <section id="page-insights" class="page"></section>
      <section id="page-profile" class="page"></section>
    </main>

    <nav id="mobileNav" class="mobile-nav" aria-label="Mobile navigation"></nav>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head"><div><span class="eyebrow">Planner · Alpha 3.0</span><h2 id="modalTitle">Add to your planner</h2></div><button class="icon-btn" id="closeModal" aria-label="Close">×</button></div>
      <form id="taskForm" class="form-grid">
        <label class="field full"><span>Title</span><input id="taskTitle" required maxlength="180" placeholder="What do you want to plan?" /></label>
        <label class="field"><span>Date</span><input id="taskDate" type="date" required /></label>
        <label class="field"><span>Schedule</span><span class="schedule-toggle"><input id="taskAllDay" type="checkbox" /> All day</span></label>
        <label class="field timed-field"><span>Start time</span><input id="taskTime" type="time" value="14:30" required /></label>
        <label class="field timed-field"><span>End time</span><input id="taskEndTime" type="time" value="15:30" required /><small class="duration-readout" id="taskDurationReadout">Duration · 1h</small></label>
        <label class="field full"><span>Category</span><select id="taskCategory"><option>Work</option><option>Personal</option><option>Finance</option><option>Love</option><option>Wellness</option><option>Social</option><option>Other</option></select></label>
        <label class="field full"><span>Priority</span><div class="segmented"><button type="button" data-priority="Low">Low</button><button type="button" data-priority="Medium" class="selected">Medium</button><button type="button" data-priority="High">High</button></div></label>
        <label class="field full"><span>Repeat</span><select id="taskRepeat"><option value="none">Does not repeat</option><option value="daily">Daily</option><option value="weekdays">Weekdays</option><option value="weekly">Weekly</option><option value="monthly">Monthly</option></select></label>
        <label class="field full" id="taskRepeatUntilField" hidden><span>Repeat until</span><input id="taskRepeatUntil" type="date" /><small class="subtle-help">Recurring plans are materialized up to this date, capped at 180 occurrences for safety.</small></label>
        <label class="field full" id="taskSeriesScopeField" hidden><span>Editing scope</span><select id="taskSeriesScope"><option value="single">This occurrence only</option><option value="future">This and future occurrences</option></select><small class="series-scope-note">Changing the recurrence pattern requires “This and future occurrences”. Past completed occurrences are preserved.</small></label>
        <fieldset class="field full"><legend>Reminders</legend><div class="reminder-grid" id="taskReminderGroup"><label class="reminder-option"><input type="checkbox" name="taskReminder" value="0" />At time</label><label class="reminder-option"><input type="checkbox" name="taskReminder" value="5" />5 min before</label><label class="reminder-option"><input type="checkbox" name="taskReminder" value="15" checked />15 min before</label><label class="reminder-option"><input type="checkbox" name="taskReminder" value="30" />30 min before</label><label class="reminder-option"><input type="checkbox" name="taskReminder" value="60" />1 hour before</label><label class="reminder-option"><input type="checkbox" name="taskReminder" value="1440" />1 day before</label></div></fieldset>
        <div class="modal-actions full"><button type="button" class="secondary-btn" id="cancelTask">Cancel</button><button class="primary-btn" id="taskSubmit" type="submit">Add to planner</button></div>
      </form>
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js?v=alpha3-0"></script>
  <script src="rpc-fix.js?v=alpha3-0"></script>
  <script src="auth-fix.js?v=alpha3-0"></script>
  <script src="password-policy.js?v=alpha3-0"></script>
  <script src="astrology-alpha2.js?v=alpha3-0"></script>
  <script src="insights-alpha30.js?v=alpha3-0"></script>
  <script src="notifications-alpha2.js?v=alpha3-0"></script>
  <script src="calendar-alpha2.js?v=alpha3-0"></script>
  <script src="planner-alpha28.js?v=alpha3-0"></script>
  <script src="planner-alpha28-compat.js?v=alpha3-0"></script>
  <script src="planner-alpha29.js?v=alpha3-0"></script>
  <script src="planner-alpha29-fix.js?v=alpha3-0"></script>
  <script src="palm-alpha2.js?v=alpha3-0"></script>
  <script src="palm-ai-alpha27.js?v=alpha3-0"></script>
  <script src="privacy-alpha2.js?v=alpha3-0"></script>
  <script src="push-alpha2.js?v=alpha3-0"></script>
  <script src="diagnostics-alpha27.js?v=alpha3-0"></script>
</body>
</html>
