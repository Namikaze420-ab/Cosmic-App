name: Staging Browser QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cosmic-staging-browser-qa
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Create disposable signed-in E2E accounts
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          token() {
            curl -fsSL \
              -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=cosmic-staging-e2e" | jq -r '.value'
          }
          broker() {
            local oidc="$1"
            local body="$2"
            curl -fsSL -X POST \
              'https://azziyvcgnxxnzpvlaijd.supabase.co/functions/v1/e2e-test-account' \
              -H "Authorization: Bearer ${oidc}" \
              -H 'Content-Type: application/json' \
              --data "$body"
          }

          OIDC="$(token)"
          # Remove any inaccessible private palm objects left by a previously interrupted
          # E2E run before creating new accounts. The broker only sweeps UUID folders
          # whose auth.users owner no longer exists.
          broker "$OIDC" '{"action":"sweep_orphans"}' >/dev/null

          A="$(broker "$OIDC" '{"action":"create"}')"
          B="$(broker "$OIDC" '{"action":"create"}')"

          A_ID="$(jq -r '.user_id' <<<"$A")"
          A_EMAIL="$(jq -r '.email' <<<"$A")"
          A_PASSWORD="$(jq -r '.password' <<<"$A")"
          B_ID="$(jq -r '.user_id' <<<"$B")"
          B_EMAIL="$(jq -r '.email' <<<"$B")"
          B_PASSWORD="$(jq -r '.password' <<<"$B")"

          for value in "$A_ID" "$A_EMAIL" "$A_PASSWORD" "$B_ID" "$B_EMAIL" "$B_PASSWORD"; do
            echo "::add-mask::$value"
          done

          {
            echo "COSMIC_E2E_A_ID=$A_ID"
            echo "COSMIC_E2E_A_EMAIL=$A_EMAIL"
            echo "COSMIC_E2E_A_PASSWORD=$A_PASSWORD"
            echo "COSMIC_E2E_B_ID=$B_ID"
            echo "COSMIC_E2E_B_EMAIL=$B_EMAIL"
            echo "COSMIC_E2E_B_PASSWORD=$B_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Run desktop, mobile and signed-in browser QA
        run: npm run test:qa

      - name: Delete disposable E2E accounts
        if: always() && github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          OIDC="$(curl -fsSL -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=cosmic-staging-e2e" | jq -r '.value')"
          broker() {
            curl -fsSL -X POST \
              'https://azziyvcgnxxnzpvlaijd.supabase.co/functions/v1/e2e-test-account' \
              -H "Authorization: Bearer ${OIDC}" \
              -H 'Content-Type: application/json' \
              --data "$1"
          }
          for USER_ID in "${COSMIC_E2E_A_ID:-}" "${COSMIC_E2E_B_ID:-}"; do
            [ -z "$USER_ID" ] && continue
            BODY="$(jq -nc --arg id "$USER_ID" '{action:"delete",user_id:$id}')"
            broker "$BODY" >/dev/null
          done
          broker '{"action":"sweep_orphans"}' >/dev/null

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
